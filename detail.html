<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail Menu | Warung R3 Berkah</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <!-- Loader -->
  <div class="loader-wrapper" id="loader">
    <div class="loader-content">
      <div class="loader-epic-container">
        <div class="epic-glow"></div>
        <div class="epic-ring ring-1"></div>
        <div class="epic-ring ring-2"></div>
        <div class="epic-ring ring-3"></div>
        <img src="assets/logo_animation.png" alt="Logo" class="loader-epic-logo">
      </div>
      <div class="loader-text">Menyiapkan Kelezatan...</div>
    </div>
  </div>


  <header class="scrolled">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <img src="assets/logo_animation.png" alt="Logo" style="width: 100%; height: 100%; object-fit: contain;">
        </div>
      </a>

      <button class="hamburger" id="hamburger-btn" onclick="toggleMobileMenu()" aria-label="Toggle menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav id="nav-menu">
        <ul>
          <li><a href="index.html#home">Home</a></li>
          <li><a href="index.html#menu">Menu</a></li>
          <li><a href="index.html#about">Tentang</a></li>
          <li><a href="index.html#why-us">Keunggulan</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="detail-page container" id="detail-content">
    <a href="index.html#menu" class="back-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      Kembali ke Menu
    </a>

    <div class="detail-grid">
      <div class="detail-img-container">
        <img src="" alt="" id="food-img">
      </div>
      <div class="detail-info">
        <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 16px;">
          <span
            style="background: rgba(255,107,53,0.1); color: var(--primary); font-size: 12px; font-weight: 900; padding: 6px 16px; border-radius: 99px; text-transform: uppercase;">Menu
            Terpopuler</span>
          <div
            style="display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 14px; font-weight: 700;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="#E53E3E">
              <path
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
            </svg>
            <span id="food-likes">0 Suka</span>
          </div>
          <div style="display: flex; align-items: center; gap: 6px; color: #F6C90E; font-size: 14px; font-weight: 700;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z" />
            </svg>
            <span id="food-rating">0.0</span>
          </div>
        </div>


        <h1 id="food-name">Nama Menu</h1>
        <p class="detail-price" id="food-price">Rp 0</p>

        <div style="margin-bottom: 32px;">
          <h3 style="margin-bottom: 12px;">Deskripsi Rasa</h3>
          <p class="detail-desc" id="food-desc"></p>
        </div>

        <div style="margin-bottom: 40px;">
          <h3 style="margin-bottom: 16px;">Bahan Utama</h3>
          <div class="ingredients-grid" id="ingredients-grid">
            <!-- Ingredients will be injected -->
          </div>
        </div>

        <a href="" id="wa-btn" target="_blank" class="btn-wa">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path
              d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z" />
          </svg>
          Pesan via WhatsApp
        </a>
      </div>
    </div>
  </main>

  <footer>
    <div class="container footer-bottom">
      <p>&copy; 2024 Warung R3 Berkah. All rights reserved.</p>
    </div>
  </footer>
